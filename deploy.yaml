runtime: none

test: |
  bash -n bin/workflow-role
  bash -n bin/extract-session-id

copy:
  - ontology.md
  - preamble.md
  - model-config.json
  - schemas/
  - roles/
  - templates/
  - guidance/

bin:
  workflow-role: bin/workflow-role
  extract-session-id: bin/extract-session-id

files:
  # Skills -> Claude Code skills directory
  /home/claude/.claude/skills/workflow-init/SKILL.md: skills/workflow-init/SKILL.md
  /home/claude/.claude/skills/workflow-status/SKILL.md: skills/workflow-status/SKILL.md
  /home/claude/.claude/skills/workflow-spec/SKILL.md: skills/workflow-spec/SKILL.md
  /home/claude/.claude/skills/workflow-review/SKILL.md: skills/workflow-review/SKILL.md
  /home/claude/.claude/skills/workflow-build/SKILL.md: skills/workflow-build/SKILL.md
  /home/claude/.claude/skills/workflow-plan/SKILL.md: skills/workflow-plan/SKILL.md
  # NOTE (2026-07-28): ~/roles/workflow/ is owned solely by the roles repository.
  # The harness/ files remain as reference templates only — deploy no longer
  # installs them, so machine-specific role policy cannot round-trip through this
  # (public) repo and deploys cannot clobber live role instructions.
